aid: hathora
name: Hathora
review:
  question: Does Hathora expose a documented public WebSocket API?
  answer: false
  date: '2026-07-01'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was created. The Hathora Cloud control-plane API is a
    conventional REST API over HTTPS. Hathora's realtime game traffic runs over
    raw TCP/UDP/TLS game-server transports negotiated per room (host + port
    returned by GetConnectionInfo), not over a documented WebSocket message API
    with an event-driven contract that AsyncAPI would model. Log endpoints
    return HTTP streaming (NDJSON), which is one-way HTTP, not WebSocket.
findings:
  summary: |
    Hathora does not publish a documented public WebSocket API on its control
    plane. The Hathora Cloud API (https://api.hathora.dev) is REST/HTTPS:
    apps, builds, deployments, processes, rooms, discovery/ping, logs, metrics,
    billing, and org tokens, plus a player-auth surface that mints short-lived
    player JWTs. Management endpoints authenticate with an organization
    developer token (hathoraDevToken, HTTP bearer JWT); room/lobby client calls
    use a player token (playerAuth, HTTP bearer JWT). The gameplay transport
    itself is whatever the game server exposes (TCP, UDP, or TLS) on the
    host/port returned by GetConnectionInfo - a game client may choose to speak
    WebSocket to its own server over that port, but that is the customer's game
    protocol, not a Hathora-documented WebSocket API. Log streaming is HTTP
    streaming (NDJSON), not WebSocket.
  stateNote: |
    IMPORTANT: As of this review, Hathora is winding down its public Hathora
    Cloud offering and moving to GameFabric; hathora.dev/pricing redirects to
    gamefabric.com. The API structure captured here reflects the documented
    Hathora Cloud REST API and its SDKs (hathora/cloud-sdk-typescript, -java,
    -go, etc.) at their last public state. Verify live availability and terms
    against GameFabric.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.hathora.dev
      documented: true
    - protocol: HTTP streaming (NDJSON)
      scheme: https
      note: Process log streaming via GET /logs/v1/{appId}/process/{processId}. One-way HTTP, not WebSocket.
      documented: true
    - protocol: Game transport (TCP / UDP / TLS)
      scheme: tcp/udp/tls
      note: Per-room gameplay transport on the host/port from GetConnectionInfo; set by the customer's game server, configured via deployment transportType.
      documented: true
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No Hathora-documented control-plane WebSocket API. Any WebSocket usage is the customer's own game protocol over the room's exposed port.
