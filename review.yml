sources:
  - url: https://hathora.dev/docs
    type: Documentation
    note: Documents the REST base URL https://api.hathora.dev and the SDK auth model (hathoraDevToken / player token).
  - url: https://github.com/hathora/cloud-sdk-typescript
    type: SDK
    note: TypeScript SDK enumerates the REST operations (AppsV2, BuildsV3, DeploymentsV3, ProcessesV3, RoomsV2, DiscoveryV2, LogsV1, MetricsV1, BillingV1, TokensV1). Base server https://api.hathora.dev.
  - url: https://github.com/hathora/hathora-cloud-sdks
    type: SDK
    note: Multi-language SDK hub for the Hathora Cloud API; confirms REST-only control plane.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket or event-driven message contract exists on the Hathora Cloud
    control plane, so no AsyncAPI document was authored. The apis.yml catalogs
    the REST management surface across eleven service areas; the OpenAPI
    artifact models representative REST endpoints and both bearer security
    schemes (hathoraDevToken, playerAuth).
