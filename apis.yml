aid: hathora
url: https://raw.githubusercontent.com/api-evangelist/hathora/refs/heads/main/apis.yml
name: Hathora
kind: company
description: Hathora provides on-demand, globally distributed dedicated compute for
  multiplayer games. Hathora Cloud spins game server processes up and down across
  regions in response to player demand, exposing a REST API to manage applications,
  builds, deployments, processes, rooms, discovery/ping, logs, metrics, billing, and
  organization tokens, plus a player-authentication surface that issues short-lived
  player tokens.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/hathora.png
tags:
